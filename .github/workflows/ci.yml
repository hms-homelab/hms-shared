name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  linux-build:
    name: Build & Test (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libspdlog-dev libyaml-cpp-dev nlohmann-json3-dev \
            libpqxx-dev libpq-dev \
            libpaho-mqtt-dev libpaho-mqttpp-dev \
            libcurl4-openssl-dev libssl-dev catch2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHMS_SHARED_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

  # ── Windows (vcpkg, mirrors hms-cpap) ──────────────────────────────────────
  windows-build:
    name: Build & Test (windows-x64)
    runs-on: windows-latest
    continue-on-error: true
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin CMake 3.31
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.7

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-win-x64-static-md-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-win-x64-static-md-

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows-static-md

      - name: Configure & build (MSVC)
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DHMS_SHARED_BUILD_TESTS=ON ..
          cmake --build . --parallel

      - name: Test
        run: cd build && ctest --output-on-failure
